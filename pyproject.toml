[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-service"
version = "0.1.0"
description = "금 분할매수 도우미 - 일간 배치 파이프라인 (변동성 예측 → 등급 → 주간 분할 플랜)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "arch>=6.2",
    "sqlalchemy>=2.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["gold_service*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
